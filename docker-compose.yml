services:
  postgres:
    image: postgres:16-alpine
    container_name: icecandylovers-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-db_geladinhos}
      POSTGRES_USER: ${POSTGRES_USER:-change-me}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_geladinhos}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icecandylovers-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/db_geladinhos}
      DB_USERNAME: ${DB_USERNAME:-change-me}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      CHAT_OPENAI_ENABLED: ${CHAT_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/chat/completions}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
