spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/db_geladinhos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.thymeleaf.cache=true

server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

logging.level.org.thymeleaf=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
