spring.application.name=projeto-icecandylovers
spring.profiles.default=dev

server.address=0.0.0.0
server.port=8080

# Configuracoes de sessao
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Forcar tratamento correto de headers em producao
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

server.error.whitelabel.enabled=false
spring.jpa.open-in-view=false

cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH

chat.openai.enabled=${CHAT_OPENAI_ENABLED:false}
chat.openai.api-key=${OPENAI_API_KEY:}
chat.openai.model=${OPENAI_MODEL:gpt-4o-mini}
chat.openai.url=${OPENAI_API_URL:https://api.openai.com/v1/chat/completions}

logging.level.org.springframework.security=INFO

pagamento.gateway.simular-recusa=false
