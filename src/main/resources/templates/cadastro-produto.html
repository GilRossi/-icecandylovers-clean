<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Produto</title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<!-- Mega Menu -->
<nav class="navbar navbar-expand-lg mega-menu" style="background-color: #9370DB;">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="/dashboard">
            🍦 Ice Candy Lovers
            <small class="d-block d-md-inline fs-6">Geladinho Gourmet</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#megaMenuContent" aria-controls="megaMenuContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="megaMenuContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <!-- Dashboard -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="/dashboard" id="dashboardDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-house-fill me-2"></i> Dashboard
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white" href="/dashboard">Visão Geral</a></li>
<!--                        <li><a class="dropdown-item text-white" href="/dashboard/estatisticas">Estatísticas</a></li>-->
                    </ul>
                </li>
                <!-- Produtos -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white active" href="#" id="produtosDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-plus-circle me-2"></i> Novo
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white active" href="/api/produtos/novo">Produto</a></li>
                        <li><a class="dropdown-item text-white" href="/ingredientes">Ingrediente</a></li>
                    </ul>
                </li>
                <!-- Vendas -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/vendas/nova">
                        <i class="bi bi-cart-fill me-2"></i> Vendas
                    </a>
                </li>
                <!-- Relatórios -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/relatorios">
                        <i class="bi bi-bar-chart-fill me-2"></i> Relatórios
                    </a>
                </li>
                <!-- Sair -->
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="nav-link text-danger bg-transparent border-0">
                            <i class="bi bi-box-arrow-left me-2"></i> Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

        <!-- Conteúdo Principal -->
        <div class="col-lg-10 p-4">
            <div class="card card-cadastro">
                <div class="card-header text-white" style="background-color: #9370DB;">
                    <h4>🍦 Cadastro de Produtos</h4>
                </div>
                <div class="card-body">
                    <form method="post" th:action="@{/api/produtos}" id="formCadastroProduto">
                        <input type="hidden" name="id" id="produtoId">

                        <!-- Seção: Informações Básicas -->
                        <div class="card mb-4">
                            <div class="card-header text-white" style="background-color: #9370DB;">
                                <h5 class="mb-0">Informações Básicas</h5>
                            </div>
                            <div class="card-body">
                                <div class="row g-3">
                                    <!-- Categoria do Produto -->
                                    <div class="mb-3">
                                        <label for="categoria" class="form-label">Categoria do Produto</label>
                                        <select class="form-select" id="categoria" name="categoria" required>
                                            <option value="">Selecione uma categoria</option>
                                            <option value="GELADINHO_GOURMET">Geladinho Gourmet</option>
                                            <option value="GELADINHO_ALCOOLICO">Geladinho Alcoólico</option>
                                            <option value="DOCINHO_GOURMET">Docinho Gourmet</option>
                                        </select>
                                    </div>

                                    <!-- Sabor (obrigatório) -->
                                    <div class="mb-3">
                                        <label for="sabor" class="form-label">Sabor do Produto</label>
                                        <input id="sabor" class="form-control" type="text" name="sabor" required placeholder="Digite o sabor">
                                    </div>

                                    <!-- Estoque -->
                                    <div class="mb-3">
                                        <label for="estoqueInicial" class="form-label">Estoque Inicial</label>
                                        <input id="estoqueInicial" class="form-control" type="number" min="1" value="1" name="estoqueInicial" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="estoqueAtual" class="form-label">Estoque Atual</label>
                                        <input id="estoqueAtual" class="form-control" type="number" min="0" value="0" name="estoqueAtual" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="precoCusto" class="form-label">Preço de Custo Total</label>
                                        <input id="precoCusto" class="form-control" type="number" min="0" step="0.01" value="0" name="precoCusto" required>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-4">
                            <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #9370DB;">
                                <h5 class="mb-0">Ingredientes do Produto</h5>
                                <button class="btn btn-sm btn-light" type="button" id="adicionarIngredienteBtn">
                                    <i class="bi bi-plus-circle me-1"></i>Adicionar Ingrediente
                                </button>
                            </div>
                            <div class="card-body">
                                <div id="ingredientesContainer" class="d-flex flex-column gap-3"></div>
                                <small class="text-muted">Selecione os ingredientes e informe a quantidade usada por unidade do produto.</small>
                            </div>
                        </div>

                        <!-- Botão de Submit -->
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-lg btn-ice" type="submit" id="salvarProdutoBtn">
                                <i class="bi bi-save2-fill me-2"></i>Salvar Produto
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast de Sucesso -->
<div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    <div class="toast-header" style="background-color: #9370DB; color: white;">
        <strong class="me-auto">Sucesso</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="filter: invert(1);"></button>
    </div>
    <div class="toast-body"></div>
</div>

<!-- Toast de Erro -->
<div id="errorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="position: fixed; top: 80px; right: 20px; z-index: 1050;">
    <div class="toast-header" style="background-color: #dc3545; color: white;">
        <strong class="me-auto">Erro</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="filter: invert(1);"></button>
    </div>
    <div class="toast-body"></div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Seus scripts -->
<script src="/js/cadastro-produto.js" defer></script>
<script src="/js/logout.js"></script>
</body>
</html>
