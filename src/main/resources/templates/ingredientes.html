<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de Ingredientes</title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<!-- Mega Menu -->
<nav class="navbar navbar-expand-lg mega-menu" style="background-color: #9370DB;">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="/dashboard">
            🍦 Ice Candy Lovers
            <small class="d-block d-md-inline fs-6">Geladinho Gourmet</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#megaMenuContent" aria-controls="megaMenuContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="megaMenuContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <!-- Dashboard -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="/dashboard" id="dashboardDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-house-fill me-2"></i> Dashboard
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white" href="/dashboard">Visão Geral</a></li>
<!--                        <li><a class="dropdown-item text-white" href="/dashboard/estatisticas">Estatísticas</a></li>-->
                    </ul>
                </li>
                <!-- Produtos -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white active" href="#" id="produtosDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-plus-circle me-2"></i> Novo
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white" href="/api/produtos/novo">Produto</a></li>
                        <li><a class="dropdown-item text-white active" href="/ingredientes">Ingrediente</a></li>
                    </ul>
                </li>
                <!-- Vendas -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/vendas/nova">
                        <i class="bi bi-cart-fill me-2"></i> Vendas
                    </a>
                </li>
                <!-- Relatórios -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/relatorios">
                        <i class="bi bi-bar-chart-fill me-2"></i> Relatórios
                    </a>
                </li>
                <!-- Promoções -->
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/promocoes}">
                        <i class="bi bi-tag-fill me-2"></i> Promoções
                    </a>
                </li>
                <!-- Sair -->
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="nav-link text-danger bg-transparent border-0">
                            <i class="bi bi-box-arrow-left me-2"></i> Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

        <!-- Conteúdo Principal -->
        <div class="col-lg-10 p-4">
            <div class="card card-cadastro">
                <div class="card-header text-white" style="background-color: #9370DB;">
                    <h4>🍦 Cadastro de Ingredientes</h4>
                </div>
                <div class="card-body">
                    <!-- Formulário Novo Ingrediente -->
                    <form id="formNovoIngrediente" class="mb-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Ingrediente</label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="unidadeMedida" class="form-label">Unidade de Medida</label>
                            <select class="form-select" id="unidadeMedida" name="unidadeMedida" required>
                                <option value="" disabled selected>Selecione uma unidade</option>
                                <option value="kg">Quilogramas (kg)</option>
                                <option value="L">Litros (L)</option>
                                <option value="unidade">Unidade</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="quantidade" class="form-label">Quantidade Inicial</label>
                            <input type="number" step="0.01" class="form-control" id="quantidade" name="quantidade" required>
                        </div>
                        <div class="mb-3">
                            <label for="precoTotal" class="form-label">Preço Total do Lote</label>
                            <input type="number" step="0.01" class="form-control" id="precoTotal" name="precoTotal" required>
                        </div>
                        <div class="d-grid gap-2 mt-4">
                            <button class="btn btn-lg btn-ice" type="submit">
                                <i class="bi bi-save2-fill me-2"></i>Salvar Ingrediente
                            </button>
                        </div>
                    </form>

                    <!-- Tabela de Ingredientes -->
                    <table class="table table-striped" id="tabelaIngredientes">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Unidade de Medida</th>
                            <th>Estoque Atual</th>
                            <th>Custo por Unidade</th>
                            <th>Ações</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- JavaScript preencherá aqui -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toasts -->
<div id="successToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="position: fixed; top: 20px; right: 20px; z-index: 1050;">
    <div class="toast-header" style="background-color: #9370DB; color: white;">
        <strong class="me-auto">Sucesso</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="filter: invert(1);"></button>
    </div>
    <div class="toast-body"></div>
</div>

<div id="errorToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true" style="position: fixed; top: 80px; right: 20px; z-index: 1050;">
    <div class="toast-header" style="background-color: #dc3545; color: white;">
        <strong class="me-auto">Erro</strong>
        <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="filter: invert(1);"></button>
    </div>
    <div class="toast-body"></div>
</div>

<!-- Modal de Edição -->
<div class="modal fade" id="editarIngredienteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #9370DB; color: white;">
                <h5 class="modal-title">Editar Ingrediente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body">
                <form id="formEditarIngrediente">
                    <input type="hidden" id="editarIngredienteId" name="id">
                    <div class="mb-3">
                        <label for="editarIngredienteNome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="editarIngredienteNome" name="nome" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarIngredienteUnidade" class="form-label">Unidade de Medida</label>
                        <select class="form-select" id="editarIngredienteUnidade" name="unidadeMedida" required>
                            <option value="" disabled>Selecione uma unidade</option>
                            <option value="kg">Quilogramas (kg)</option>
                            <option value="L">Litros (L)</option>
                            <option value="unidade">Unidade</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="editarIngredienteEstoque" class="form-label">Estoque Atual</label>
                        <input type="number" step="0.01" class="form-control" id="editarIngredienteEstoque" name="estoqueAtual" required>
                    </div>
                    <div class="mb-3">
                        <label for="editarIngredienteCusto" class="form-label">Custo por Unidade</label>
                        <input type="number" step="0.01" class="form-control" id="editarIngredienteCusto" name="custoPorUnidade" required>
                    </div>
                    <button type="submit" class="btn btn-ice">Salvar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal de Adicionar Lote -->
<div class="modal fade" id="adicionarLoteModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header" style="background-color: #9370DB; color: white;">
                <h5 class="modal-title">Adicionar Lote</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" style="filter: invert(1);"></button>
            </div>
            <div class="modal-body">
                <form id="formAdicionarLote">
                    <input type="hidden" id="loteIngredienteId" name="ingredienteId">
                    <div class="mb-3">
                        <label for="loteQuantidade" class="form-label">Quantidade</label>
                        <input type="number" step="0.01" class="form-control" id="loteQuantidade" name="quantidade" required>
                    </div>
                    <div class="mb-3">
                        <label for="loteValorTotal" class="form-label">Valor Total</label>
                        <input type="number" step="0.01" class="form-control" id="loteValorTotal" name="valorTotal" required>
                    </div>
                    <button type="button" class="btn btn-ice" id="salvarLoteBtn">Salvar</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/logout.js}"></script>
<script th:src="@{/js/ingredientes-script.js}"></script>
</body>
</html>
