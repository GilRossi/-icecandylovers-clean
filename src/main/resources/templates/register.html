<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Ice Candy Lovers</title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="form-container bg-white">
        <h2 class="text-center mb-4">Criar Nova Conta</h2>

        <div th:if="${param.registerSuccess}" class="alert alert-success">
            Cadastro realizado com sucesso! Você já pode fazer login.
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">Nome de Usuário</label>
                <input type="text" class="form-control" id="username"
                       th:field="*{username}" required
                       placeholder="Digite seu nome de usuário">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('username')}"
                     th:errors="*{username}"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password"
                       th:field="*{password}" required
                       placeholder="Digite uma senha (mínimo 6 caracteres)">
                <div class="invalid-feedback d-block"
                     th:if="${#fields.hasErrors('password')}"
                     th:errors="*{password}"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>

            <div class="mt-3 text-center">
                <span>Já tem uma conta? </span>
                <a th:href="@{/login}" class="text-decoration-none">Faça login</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
