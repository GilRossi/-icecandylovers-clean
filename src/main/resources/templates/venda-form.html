<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${vendaId != null} ? 'Editar Venda - Ice Candy Lovers' : 'Registro de Vendas - Ice Candy Lovers'"></title>
    <link rel="icon" type="image/png" href="/assets/favicon.ico">

    <!-- Bootstrap 5 e Ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="/css/style.css">

    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="bg-light">
<!-- Mega Menu -->
<nav class="navbar navbar-expand-lg mega-menu" style="background-color: #9370DB;">
    <div class="container-fluid">
        <a class="navbar-brand text-white fw-bold" href="/dashboard">
            🍦 Ice Candy Lovers
            <small class="d-block d-md-inline fs-6">Geladinho Gourmet</small>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#megaMenuContent" aria-controls="megaMenuContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="megaMenuContent">
            <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                <!-- Dashboard -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="/dashboard" id="dashboardDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-house-fill me-2"></i> Dashboard
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white" href="/dashboard">Visão Geral</a></li>
                        <!--<li><a class="dropdown-item text-white" href="/dashboard/estatisticas">Estatísticas</a></li>-->
                    </ul>
                </li>
                <!-- Produtos -->
                <li class="nav-item dropdown">
                    <a class="nav-link text-white" href="#" id="produtosDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-plus-circle me-2"></i> Novo
                    </a>
                    <ul class="dropdown-menu" style="background-color: #A68CD9;">
                        <li><a class="dropdown-item text-white" href="/api/produtos/novo">Produto</a></li>
                        <li><a class="dropdown-item text-white" href="/ingredientes">Ingrediente</a></li>
                    </ul>
                </li>
                <!-- Vendas -->
                <li class="nav-item">
                    <a class="nav-link text-white active" href="/vendas/nova">
                        <i class="bi bi-cart-fill me-2"></i> Vendas
                    </a>
                </li>
                <!-- Relatórios -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="/relatorios">
                        <i class="bi bi-bar-chart-fill me-2"></i> Relatórios
                    </a>
                </li>
                <!-- Promoções -->
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/promocoes}">
                        <i class="bi bi-tag-fill me-2"></i> Promoções
                    </a>
                </li>
                <!-- Sair -->
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" id="logoutForm" style="display: inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button type="submit" class="nav-link text-danger bg-transparent border-0">
                            <i class="bi bi-box-arrow-left me-2"></i> Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
        <!-- Main Content -->
        <div class="col-lg-10 p-4">
            <div class="card card-cadastro shadow-sm mb-4">
                <div class="card-header text-white" style="background-color: #9370DB;">
                    <h4 class="mb-0">
                        <i class="bi bi-cart-plus me-2"></i>
                        <span th:text="${vendaId != null} ? 'Editar Venda' : 'Registro de Venda'"></span>
                    </h4>
                </div>
                <div class="card-body">
                    <form id="formVenda" th:action="@{${vendaId != null} ? '/vendas/editar/' + ${vendaId} : '/vendas/nova'}" method="post">
                        <input type="hidden" id="vendaId" th:value="${vendaId}" />

                        <!-- Success/Error Messages -->
                        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                            <span th:text="${vendaId != null} ? 'Venda atualizada com sucesso!' : 'Venda registrada com sucesso!'"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                        </div>
                        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <span th:text="${vendaId != null} ? 'Erro ao atualizar venda: ' : 'Erro ao registrar venda: '"></span>
                            <span th:text="${param.error}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                        </div>

                        <!-- Data da Venda -->
                        <div class="mb-3">
                            <label for="dataVenda" class="form-label fw-bold">Data e Hora da Venda</label>
                            <input type="datetime-local" name="dataVenda"
                                   th:value="${venda.dataVenda != null} ? ${#temporals.format(venda.dataVenda, 'yyyy-MM-dd') + 'T' + #temporals.format(venda.dataVenda, 'HH:mm')} : ${currentDateTime}"
                                   id="dataVenda" class="form-control" required/>
                        </div>

                        <!-- Produto -->
                        <div class="mb-3">
                            <label for="produtoId" class="form-label fw-bold">Produto</label>
                            <select name="produtoId" id="produtoId" class="form-select" required>
                                <option value="">Selecione um produto...</option>
                                <option th:each="produto : ${produtos}"
                                        th:value="${produto.id}"
                                        th:text="${produto.sabor}"
                                        th:selected="${venda.produtoId != null} ? ${venda.produtoId == produto.id} : false"></option>
                            </select>
                        </div>

                        <!-- Painel de Promoções Ativas -->
                        <div id="promocoesPanel" class="mb-3" style="display: none;">
                            <div class="alert alert-success mb-0 py-2">
                                <h6 class="mb-1"><i class="bi bi-tag-fill me-1"></i> Promoções Ativas</h6>
                                <ul id="promocoesList" class="mb-0 ps-3 small"></ul>
                            </div>
                        </div>

                        <!-- Local da Venda -->
                        <div class="mb-3">
                            <label for="vendido" class="form-label fw-bold">Local da Venda</label>
                            <select name="vendido" id="vendido">
                                <option th:each="tipoVendido : ${T(com.icecandylovers.entities.Vendido).values()}"
                                        th:value="${tipoVendido}"
                                        th:text="${tipoVendido}"
                                        th:selected="${tipoVendido.equals(venda.vendido)}">
                                </option>
                            </select>
                        </div>

                        <!-- Forma de Pagamento -->
                        <div class="mb-3">
                            <label for="formaPagamento" class="form-label fw-bold">Forma de Pagamento</label>
                            <select name="formaPagamento" id="formaPagamento" class="form-select" required>
                                <option value="">Selecione a forma de pagamento...</option>
                                <option value="CARTÃO CREDITO" th:selected="${venda.formaPagamento == 'CARTÃO CREDITO'}">Cartão de Crédito</option>
                                <option value="CARTÃO DEBITO" th:selected="${venda.formaPagamento == 'CARTÃO DEBITO'}">Cartão de Débito</option>
                                <option value="PIX" th:selected="${venda.formaPagamento == 'PIX'}">PIX</option>
                                <option value="DINHEIRO" th:selected="${venda.formaPagamento == 'DINHEIRO'}">Dinheiro</option>
                                <option value="BOLETO" th:selected="${venda.formaPagamento == 'BOLETO'}">Boleto</option>
                            </select>
                        </div>

                        <!-- Quantidade -->
                        <div class="mb-3">
                            <label for="quantidade" class="form-label fw-bold">Quantidade Vendida</label>
                            <input type="number" name="quantidade" th:value="${venda.quantidade}" id="quantidade" class="form-control" min="1" placeholder="Ex: 5" required/>
                        </div>

                        <!-- Valor Unitário -->
                        <div class="mb-3">
                            <label for="valorUnitarioVenda" class="form-label fw-bold">Valor Unitário (R$)</label>
                            <input type="number" name="valorUnitarioVenda" th:value="${venda.valorUnitarioVenda}" id="valorUnitarioVenda" class="form-control" step="0.01" min="0.01" placeholder="Ex: 4.50" required/>
                        </div>

                        <!-- Botão de Submissão -->
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-ice btn-lg">
                                <i class="bi bi-save2-fill me-2"></i>
                                <span th:text="${vendaId != null} ? 'Atualizar Venda' : 'Registrar Venda'"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Tabela de Vendas -->
            <div class="table-responsive-ice">
                <h3>Vendas Registradas</h3>
                <table id="tabelaVendas" class="table table Ice table-hover">
                    <thead>
                    <tr>
                        <th>Data da Venda</th>
                        <th>Produto</th>
                        <th>Quantidade</th>
                        <th>Local</th>
                        <th>Forma de Pagamento</th>
                        <th>Valor Unitário (R$)</th>
                        <th>Total (R$)</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Scripts Personalizados -->
<script src="/js/venda-scripts.js"></script>
<script src="/js/logout.js"></script>

<script>
(function () {
    'use strict';
    const produtoSelect = document.getElementById('produtoId');
    const promocoesPanel = document.getElementById('promocoesPanel');
    const promocoesList = document.getElementById('promocoesList');

    if (!produtoSelect || !promocoesPanel || !promocoesList) return;

    async function carregarPromocoes(produtoId) {
        promocoesPanel.style.display = 'none';
        promocoesList.innerHTML = '';
        if (!produtoId) return;
        try {
            const resp = await fetch('/promocoes/produto/' + encodeURIComponent(produtoId));
            if (!resp.ok) return;
            const promocoes = await resp.json();
            const ativas = promocoes.filter(p => p.ativo);
            if (ativas.length === 0) return;
            ativas.forEach(p => {
                const li = document.createElement('li');
                const desconto = p.tipo === 'PERCENTUAL'
                    ? p.valor + '% de desconto'
                    : 'R$ ' + parseFloat(p.valor).toFixed(2).replace('.', ',') + ' de desconto';
                li.textContent = p.nome + ' — ' + desconto;
                promocoesList.appendChild(li);
            });
            promocoesPanel.style.display = 'block';
        } catch (e) {
            // silencia erros de rede para não bloquear o formulário
        }
    }

    produtoSelect.addEventListener('change', function () {
        carregarPromocoes(this.value);
    });

    // Carrega promoções para o produto já selecionado (modo edição)
    if (produtoSelect.value) {
        carregarPromocoes(produtoSelect.value);
    }
})();
</script>
</body>
</html>
